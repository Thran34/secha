apiVersion: secha/v1
kind: Experiment
metadata:
  name: networkpolicy-web-to-db-noauth
  hypothesis: >
    Control variant with defense-in-depth removed: redis has no AUTH, so
    deleting the NetworkPolicy exposes the secret directly and no auth-based
    detection fires. Quantifies what the AUTH layer buys (resilience delta).
steadyState:
  checks:
    - type: redis-exfil
      from:
        namespace: attacker
        pod: attacker
      target: redis-open.target.svc.cluster.local:6379
      expect:
        reachable: false
    - type: redis-key-present
      target:
        namespace: target
        selector: app=redis-open
      key: secret:flag
      expect:
        dataExposed: true
fault:
  type: k8s-networkpolicy
  action: delete
  target:
    namespace: target
    name: redis-open-allow-web-only
probe:
  type: redis-exfil
  from:
    namespace: attacker
    pod: attacker
  target: redis-open.target.svc.cluster.local:6379
observe:
  window: 10s
  detectors:
    - type: redis-acl-log
      target:
        namespace: target
        selector: app=redis-open
indicators: [exposure, defense_in_depth_depth, mttd, recovery_latency]
